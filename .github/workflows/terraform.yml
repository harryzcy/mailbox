name: Terraform

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Terraform Validate
    runs-on: ubuntu-24.04

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Terraform fmt
        run: terraform fmt -check

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27
          check-latest: true
        
      - name: Build zip files
        run: |
          make build-lambda
      
      # No backend needed to validate, so this job needs no AWS credentials.
      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  plan:
    name: Terraform Plan
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      # Account-based DynamoDB endpoints leak the account ID via DNS
      AWS_ACCOUNT_ID_ENDPOINT_MODE: disabled
      TF_VAR_aws_s3_bucket_override: ${{ secrets.TF_VAR_AWS_S3_BUCKET_OVERRIDE }}
      TF_VAR_aws_dynamodb_table_override: ${{ secrets.TF_VAR_AWS_DYNAMODB_TABLE_OVERRIDE }}
      TF_VAR_ses_receipt_rule_set_name: ${{ secrets.TF_VAR_SES_RECEIPT_RULE_SET_NAME }}
      TF_VAR_ses_receipt_rule_name: ${{ secrets.TF_VAR_SES_RECEIPT_RULE_NAME }}
    # id-token mints the OIDC token, scoped to this job
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27
          check-latest: true
        
      - name: Build zip files
        run: |
          make build-lambda

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: us-west-2

      - name: Terraform Init
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      # Public repo: log counts only, never the diff
      - name: Terraform Plan
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -out=tfplan > /dev/null
          terraform show -json tfplan | jq -r '
            [ .resource_changes[]?
              | select(.change.actions != ["no-op"])
              | if (.change.actions | length) > 1 then "replace" else .change.actions[0] end
            ]
            | group_by(.) | map("\(.[0])=\(length)") | join(" ")
            | if . == "" then "no changes" else . end
          '
