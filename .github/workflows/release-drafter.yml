name: Release Drafter

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  update:
    name: Generate Notes
    permissions:
      contents: write
      pull-requests: read
    uses: harryzcy/github-actions/.github/workflows/release-drafter.yml@095a6f493e98d00fdc9d09654699d0522dc2be8d # main
