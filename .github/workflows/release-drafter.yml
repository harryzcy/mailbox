name: Release Drafter

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  update:
    name: Generate Notes
    permissions:
      contents: write
      pull-requests: read
    uses: harryzcy/github-actions/.github/workflows/release-drafter.yml@79a4cd8c212b2b3b4600387355eda5af20a47b80 # main
