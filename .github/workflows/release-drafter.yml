name: Release Drafter

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  update:
    name: Generate Notes
    permissions:
      contents: write
      pull-requests: read
    uses: harryzcy/github-actions/.github/workflows/release-drafter.yml@7dafb3c18ece98ed98a2d9d3db90f20aa9466dcc # main
