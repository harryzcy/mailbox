name: Release Drafter

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  update:
    name: Generate Notes
    permissions:
      contents: write
      pull-requests: read
    uses: harryzcy/github-actions/.github/workflows/release-drafter.yml@02fc72c25755dac3a0c635b1e4d48ea549639eec # main
